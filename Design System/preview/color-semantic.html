<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { padding: 16px 20px; gap: 12px; }
  .row { gap: 10px; }
  .chip { flex: 1; padding: 10px 12px; border-radius: 8px; font-family: 'Roboto'; font-size: 12px; font-weight: 500; display: flex; flex-direction: column; gap: 2px; }
  .chip b { font-weight: 700; font-size: 13px; }
  .chip span { font-size: 10px; opacity: .8; letter-spacing: 0.06em; }
</style></head><body>
<div class="sa-eyebrow">Semantic · status</div>
<div class="row">
  <div class="chip" style="background:#0AD181;color:#00004C"><b>Success / On-site</b><span>#0AD181</span></div>
  <div class="chip" style="background:#FD0000;color:#fff"><b>Danger</b><span>#FD0000</span></div>
  <div class="chip" style="background:#F2A93B;color:#11151C"><b>Warning*</b><span>#F2A93B — derived</span></div>
  <div class="chip" style="background:#156CC9;color:#fff"><b>Info</b><span>#156CC9</span></div>
</div>
<div class="sa-eyebrow">Semantic · link</div>
<div class="row">
  <div class="chip" style="background:#fff;color:#156CC9;border:1px solid #D8DFE8"><b>Link (light)</b><span>#156CC9</span></div>
  <div class="chip" style="background:#00004C;color:#01B4D2"><b>Link (on-navy)</b><span>#01B4D2</span></div>
</div>
</body></html>
