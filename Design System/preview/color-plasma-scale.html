<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { padding: 0; }
  .wrap { display: grid; grid-template-columns: repeat(5, 1fr); height: 100%; }
  .s { padding: 12px; color: #00004C; display: flex; flex-direction: column; justify-content: space-between; font-family: 'Roboto'; }
  .name { font-weight: 700; font-size: 13px; }
  .hex  { font-weight: 500; font-size: 10px; letter-spacing: 0.06em; opacity: .85; }
</style></head><body>
<div class="wrap">
  <div class="s" style="background:#D4F3F9"><div class="name">Plasma 100</div><div class="hex">#D4F3F9</div></div>
  <div class="s" style="background:#7ADDEC"><div class="name">Plasma 300</div><div class="hex">#7ADDEC</div></div>
  <div class="s" style="background:#38C8DE"><div class="name">Plasma 400</div><div class="hex">#38C8DE</div></div>
  <div class="s" style="background:#01B4D2;color:#fff"><div class="name">Plasma 500</div><div class="hex">#01B4D2</div></div>
  <div class="s" style="background:#0190A8;color:#fff"><div class="name">Plasma 600</div><div class="hex">#0190A8</div></div>
</div>
</body></html>
