<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { padding: 0; }
  .wrap { display: grid; grid-template-columns: repeat(5, 1fr); height: 100%; }
  .swatch { padding: 16px 14px; display: flex; flex-direction: column; justify-content: space-between; color: #fff; }
  .name { font-family: 'Roboto'; font-weight: 700; font-size: 14px; letter-spacing: -0.005em; line-height: 1.2; }
  .hex  { font-family: 'Roboto'; font-weight: 500; font-size: 11px; letter-spacing: 0.08em; opacity: .9; }
  .role { font-family: 'Roboto'; font-weight: 400; font-size: 10px; opacity: .75; margin-top: 2px; }
</style></head><body>
<div class="wrap">
  <div class="swatch" style="background:#156CC9"><div><div class="name">Mid Blue</div><div class="role">Links · info</div></div><div class="hex">#156CC9</div></div>
  <div class="swatch" style="background:#FD0000"><div><div class="name">Red</div><div class="role">Errors only</div></div><div class="hex">#FD0000</div></div>
  <div class="swatch" style="background:#0AD181;color:#00004C"><div><div class="name">Green</div><div class="role">On-site · success</div></div><div class="hex">#0AD181</div></div>
  <div class="swatch" style="background:#4B5767"><div><div class="name">Gray Blue</div><div class="role">Body secondary</div></div><div class="hex">#4B5767</div></div>
  <div class="swatch" style="background:#3EB8A4"><div><div class="name">Teal</div><div class="role">Product accents</div></div><div class="hex">#3EB8A4</div></div>
</div>
</body></html>
