<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { padding: 0; background: #00004C; }
  .nav { display: flex; align-items: center; gap: 22px; padding: 14px 22px; font-family: 'Inter'; color: #fff; }
  .logo { height: 30px; }
  .links { display: flex; gap: 20px; margin-left: 14px; font-size: 14px; }
  .links a { color: rgba(255,255,255,0.78); }
  .links a.active { color: #01B4D2; font-weight: 600; }
  .spacer { flex: 1; }
  .cta { background: #01B4D2; color: #00004C; font-weight: 700; padding: 8px 14px; border-radius: 8px; font-size: 13px; }
  .wave { height: 60px; background: repeating-linear-gradient(90deg, rgba(1,180,210,0.14) 0 1px, transparent 1px 6px); mask: radial-gradient(ellipse at 20% 0%, transparent 30%, black 50%); }
</style></head><body>
<div class="nav">
  <img class="logo" src="../assets/logos/logo-horizontal-white.png" />
  <div class="links"><a class="active">Platform</a><a>Products</a><a>Compliance</a><a>About</a></div>
  <div class="spacer"></div>
  <a style="color:#fff;font-size:13px">Sign in</a>
  <a class="cta">Book a demo</a>
</div>
<div class="wave"></div>
</body></html>
