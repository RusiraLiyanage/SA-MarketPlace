<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { padding: 20px 24px; gap: 10px; }
  .lbl { font-family: 'Roboto'; font-size: 10px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #8A95A6; }
  .row { display: flex; align-items: center; gap: 14px; }
  .box { border-radius: 2px; background: #01B4D2; }
  .label { font-family: 'Roboto'; font-size: 12px; color: #4B5767; min-width: 72px; }
</style></head><body>
<div class="lbl">Spacing scale · 4px base</div>
<div class="row"><span class="label">--space-1</span><div class="box" style="width:4px;height:16px"></div><span class="label">4px</span></div>
<div class="row"><span class="label">--space-2</span><div class="box" style="width:8px;height:16px"></div><span class="label">8px</span></div>
<div class="row"><span class="label">--space-3</span><div class="box" style="width:12px;height:16px"></div><span class="label">12px</span></div>
<div class="row"><span class="label">--space-4</span><div class="box" style="width:16px;height:16px"></div><span class="label">16px</span></div>
<div class="row"><span class="label">--space-5</span><div class="box" style="width:24px;height:16px"></div><span class="label">24px</span></div>
<div class="row"><span class="label">--space-6</span><div class="box" style="width:32px;height:16px"></div><span class="label">32px</span></div>
<div class="row"><span class="label">--space-7</span><div class="box" style="width:48px;height:16px"></div><span class="label">48px</span></div>
<div class="row"><span class="label">--space-8</span><div class="box" style="width:64px;height:16px"></div><span class="label">64px</span></div>
</body></html>
