<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { padding: 22px 24px; background: #F5F7FA; gap: 14px; }
  .lbl { font-family: 'Roboto'; font-size: 10px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #4B5767; }
  .card { background: #fff; border: 1px solid #D8DFE8; border-radius: 12px; box-shadow: 0 2px 4px rgba(0,0,76,0.06); padding: 16px 18px; font-family: 'Inter'; max-width: 420px; }
  .card .title { font-weight: 700; color: #00004C; font-size: 15px; }
  .card .sub { font-size: 12px; color: #4B5767; margin-top: 2px; }
  .card .meta { display: flex; gap: 10px; margin-top: 10px; font-size: 11px; color: #4B5767; }
  .badge { background: rgba(10,209,129,0.15); color: #057a4c; padding: 3px 8px; border-radius: 999px; font-weight: 500; }
</style></head><body>
<div class="lbl">Card · data row</div>
<div class="card">
  <div class="title">Collection #SA-04281</div>
  <div class="sub">Donor: Morgan P.  ·  Site: Wollongong Depot</div>
  <div class="meta"><span class="badge">On-site</span><span>Started 09:14</span><span>Collector R. Chen</span></div>
</div>
</body></html>
