<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { padding: 0; }
  .wrap { display: grid; grid-template-columns: repeat(8, 1fr); height: 100%; }
  .s { padding: 10px 8px; display: flex; flex-direction: column; justify-content: space-between; font-family: 'Roboto'; font-size: 10px; }
  .name { font-weight: 700; font-size: 11px; }
  .hex  { font-weight: 500; letter-spacing: 0.05em; opacity: .85; }
</style></head><body>
<div class="wrap">
  <div class="s" style="background:#FFFFFF;color:#00004C;border-right:1px solid #EBEFF4"><div class="name">White</div><div class="hex">#FFFFFF</div></div>
  <div class="s" style="background:#F5F7FA;color:#00004C"><div class="name">Gray 50</div><div class="hex">#F5F7FA</div></div>
  <div class="s" style="background:#EBEFF4;color:#00004C"><div class="name">Gray 100</div><div class="hex">#EBEFF4</div></div>
  <div class="s" style="background:#D8DFE8;color:#00004C"><div class="name">Gray 200</div><div class="hex">#D8DFE8</div></div>
  <div class="s" style="background:#BBC4D1;color:#00004C"><div class="name">Gray 300</div><div class="hex">#BBC4D1</div></div>
  <div class="s" style="background:#8A95A6;color:#fff"><div class="name">Gray 400</div><div class="hex">#8A95A6</div></div>
  <div class="s" style="background:#4B5767;color:#fff"><div class="name">Gray 500</div><div class="hex">#4B5767</div></div>
  <div class="s" style="background:#11151C;color:#fff"><div class="name">Gray 900</div><div class="hex">#11151C</div></div>
</div>
</body></html>
