<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { padding: 0; }
  .wrap { display: grid; grid-template-columns: repeat(5, 1fr); height: 100%; }
  .s { padding: 12px; color: #fff; display: flex; flex-direction: column; justify-content: space-between; font-family: 'Roboto'; }
  .name { font-weight: 700; font-size: 13px; }
  .hex  { font-weight: 500; font-size: 10px; letter-spacing: 0.06em; opacity: .85; }
</style></head><body>
<div class="wrap">
  <div class="s" style="background:#000033"><div class="name">Navy 950</div><div class="hex">#000033</div></div>
  <div class="s" style="background:#00004C"><div class="name">Navy 900</div><div class="hex">#00004C</div></div>
  <div class="s" style="background:#0A1566"><div class="name">Navy 800</div><div class="hex">#0A1566</div></div>
  <div class="s" style="background:#1C2E80"><div class="name">Navy 700</div><div class="hex">#1C2E80</div></div>
  <div class="s" style="background:#2E4A9A"><div class="name">Navy 600</div><div class="hex">#2E4A9A</div></div>
</div>
</body></html>
