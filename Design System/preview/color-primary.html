<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { padding: 0; }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; height: 100%; }
  .swatch { padding: 24px; display: flex; flex-direction: column; justify-content: space-between; }
  .navy { background: #00004C; color: #fff; }
  .plasma { background: #01B4D2; color: #00004C; }
  .name { font-family: 'Roboto'; font-weight: 700; font-size: 22px; letter-spacing: -0.01em; }
  .role { font-family: 'Roboto'; font-weight: 400; font-size: 13px; opacity: .8; margin-top: 4px; }
  .hex  { font-family: 'Roboto'; font-weight: 500; font-size: 14px; letter-spacing: 0.06em; }
</style></head><body>
<div class="wrap">
  <div class="swatch navy">
    <div><div class="name">SA Navy</div><div class="role">Headings · solid backgrounds</div></div>
    <div class="hex">#00004C</div>
  </div>
  <div class="swatch plasma">
    <div><div class="name">SA Plasma</div><div class="role">Sub-heads · accents · highlight</div></div>
    <div class="hex">#01B4D2</div>
  </div>
</div>
</body></html>
