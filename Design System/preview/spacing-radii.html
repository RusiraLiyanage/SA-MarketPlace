<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { padding: 20px 24px; gap: 14px; }
  .lbl { font-family: 'Roboto'; font-size: 10px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #8A95A6; }
  .row { display: flex; align-items: center; gap: 14px; }
  .box { width: 60px; height: 48px; background: #00004C; }
  .label { font-family: 'Roboto'; font-size: 12px; color: #4B5767; }
  b { color: #00004C; font-weight: 700; }
</style></head><body>
<div class="lbl">Corner radii</div>
<div class="row">
  <div class="box" style="border-radius:2px"></div><span class="label"><b>xs</b> 2px · chips, ticks</span>
  <div class="box" style="border-radius:4px"></div><span class="label"><b>sm</b> 4px · inputs</span>
  <div class="box" style="border-radius:8px"></div><span class="label"><b>md</b> 8px · buttons</span>
</div>
<div class="row">
  <div class="box" style="border-radius:12px"></div><span class="label"><b>lg</b> 12px · cards</span>
  <div class="box" style="border-radius:16px"></div><span class="label"><b>xl</b> 16px · hero cards</span>
  <div class="box" style="border-radius:999px;width:80px"></div><span class="label"><b>pill</b> · badges</span>
</div>
</body></html>
